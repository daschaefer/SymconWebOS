<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    :root {
        --body: #1c1e22;
        --body-hi: #2a2d33;
        --key: #2f3239;
        --key-hi: #3a3e46;
        --key-press: #4a4f59;
        --text: #e9ebef;
        --muted: #8b9099;
        --accent: #d4003c;   /* LG red */
        --on: #3ddc84;
        --ring: #25282e;
    }
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
        touch-action: manipulation; /* no double-tap zoom on phones */
    }
    #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #remote {
        width: 250px; box-sizing: border-box; padding: 14px 14px 16px;
        border-radius: 34px;
        background: linear-gradient(160deg, var(--body-hi), var(--body) 55%);
        box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
        color: var(--text);
        display: grid; gap: 10px;
        grid-template-columns: 1fr;
        grid-template-areas: "head" "top" "nav" "sub" "rock" "media" "color" "apps";
        transform-origin: center center;
    }
    #remote.wide {
        width: 540px; grid-template-columns: 220px 1fr; column-gap: 18px;
        grid-template-areas: "head head" "nav top" "nav rock" "sub media" "color apps";
        border-radius: 30px;
    }
    .head { grid-area: head; display: flex; align-items: center; gap: 10px; min-height: 30px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; transition: background .2s, box-shadow .2s; }
    .dot.on { background: var(--on); box-shadow: 0 0 8px var(--on); }
    .title { flex: 1; min-width: 0; }
    .title .app { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    button {
        font: inherit; color: var(--text); border: 0; cursor: pointer; outline: none;
        background: var(--key); border-radius: 12px;
        box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
        display: inline-flex; align-items: center; justify-content: center;
        transition: background .12s, transform .06s;
        padding: 0;
    }
    button:hover { background: var(--key-hi); }
    button:active, button.pressed { background: var(--key-press); transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
    button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .power { width: 38px; height: 38px; border-radius: 50%; background: #3a2328; color: #ff5a7a; flex: none; }
    .power.on { background: var(--accent); color: #fff; box-shadow: 0 0 14px rgba(212,0,60,.55); }

    .top { grid-area: top; display: grid; grid-template-columns: 1fr 40px 40px; gap: 8px; }
    .top button { height: 36px; }
    select {
        height: 36px; border-radius: 12px; border: 0; padding: 0 10px; min-width: 0;
        background: var(--key); color: var(--text); font: inherit; font-size: 13px; outline: none;
        box-shadow: 0 2px 0 rgba(0,0,0,.35);
        -webkit-appearance: none; appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px;
        background-size: 5px 5px; background-repeat: no-repeat;
    }

    .nav { grid-area: nav; display: flex; justify-content: center; align-items: center; }
    .dpad {
        position: relative; width: 190px; height: 190px; border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, #33363d, var(--ring) 70%);
        box-shadow: inset 0 2px 6px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.05);
    }
    .dpad button { position: absolute; background: transparent; box-shadow: none; border-radius: 14px; color: var(--muted); }
    .dpad button:hover { color: var(--text); background: rgba(255,255,255,.05); }
    .dpad button:active, .dpad button.pressed { background: rgba(255,255,255,.12); color: #fff; }
    .dpad .up    { top: 4%;    left: 34%; width: 32%; height: 25%; }
    .dpad .down  { bottom: 4%; left: 34%; width: 32%; height: 25%; }
    .dpad .left  { left: 4%;   top: 34%;  width: 25%; height: 32%; }
    .dpad .right { right: 4%;  top: 34%;  width: 25%; height: 32%; }
    .dpad .ok {
        top: 29%; left: 29%; width: 42%; height: 42%; border-radius: 50%;
        background: linear-gradient(160deg, #3d4149, #2c2f35); color: var(--text); font-weight: 700; font-size: 15px; letter-spacing: .5px;
        box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .dpad .ok:active, .dpad .ok.pressed { background: #4a4f59; }

    .sub { grid-area: sub; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sub button { height: 34px; font-size: 12px; gap: 6px; }

    .rock { grid-area: rock; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: center; }
    .rocker { display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; background: var(--key); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
    .rocker button { height: 42px; border-radius: 0; background: transparent; box-shadow: none; font-size: 20px; font-weight: 300; }
    .rocker button:active, .rocker button.pressed { background: var(--key-press); }
    .rocker .lbl { text-align: center; font-size: 10px; letter-spacing: 1px; color: var(--muted); padding: 2px 0; }
    .mid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .mute { width: 48px; height: 48px; border-radius: 50%; }
    .mute.active { background: #5a4a1a; color: #ffcf4a; }
    .vol { font-size: 11px; color: var(--muted); min-height: 13px; }

    .media { grid-area: media; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .media button { height: 34px; border-radius: 10px; }
    .media svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }

    .color { grid-area: color; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .color button { height: 14px; border-radius: 7px; }
    .c-red { background: #d33b3b; } .c-green { background: #3fae5a; } .c-yellow { background: #e1c542; } .c-blue { background: #3a74d6; }
    .color button:hover { filter: brightness(1.15); }

    .apps { grid-area: apps; display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
    .apps::-webkit-scrollbar { display: none; }
    .apps button { flex: none; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 12px; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .apps button.current { background: #3b2a31; color: #ff8aa5; }
    .apps:empty { display: none; }

    /* ---------- Full-area page layout ---------- */
    html.page, body.page { background: var(--body); overflow: hidden; }
    body.page #stage { display: block; position: relative; }
    body.page #remote {
        position: absolute; left: 0; top: 0; transform-origin: 0 0; box-sizing: border-box;
        border-radius: 0; box-shadow: none; background: var(--body);
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
        gap: 12px; align-content: stretch;
        grid-template-rows: auto auto 1fr auto auto auto auto auto;
    }
    body.page #remote.wide { grid-template-columns: 1fr 1.25fr; grid-template-rows: auto 1fr auto auto auto; column-gap: 24px; }
    body.page .nav { min-height: 0; overflow: hidden; }
    body.page .dpad { width: 220px; height: 220px; flex: none; } /* real size is set by fit() */
    body.page .dpad .ok { font-size: 20px; }
    body.page .dpad svg { width: 26px; height: 26px; }
    body.page .title .app { font-size: 18px; }
    body.page .title .sub { font-size: 13px; }
    body.page .power { width: 46px; height: 46px; }
    body.page .top { grid-template-columns: 1fr 48px 48px; gap: 10px; }
    body.page .top button, body.page select { height: 44px; font-size: 15px; }
    body.page select { background-position: calc(100% - 17px) 20px, calc(100% - 12px) 20px; }
    body.page .sub button { height: 42px; font-size: 14px; }
    body.page .rocker button { height: 50px; font-size: 24px; }
    body.page .mute { width: 58px; height: 58px; }
    body.page .vol { font-size: 13px; }
    body.page .media button { height: 42px; }
    body.page .media svg { width: 20px; height: 20px; }
    body.page .color button { height: 16px; }
    body.page .apps button { height: 38px; font-size: 14px; padding: 0 16px; border-radius: 19px; }
    /* short screens (phone in landscape) */
    @media (max-height: 520px) {
        body.page #remote { gap: 8px; padding-top: 8px; padding-bottom: 8px; }
        body.page .power { width: 38px; height: 38px; }
        body.page .top button, body.page select { height: 36px; font-size: 13px; }
        body.page .sub button, body.page .media button { height: 34px; }
        body.page .rocker button { height: 38px; font-size: 20px; }
        body.page .mute { width: 46px; height: 46px; }
        body.page .apps button { height: 32px; font-size: 13px; }
        body.page .title .app { font-size: 15px; }
    }

    /* ---------- Compact remote ---------- */
    #compact { display: none; }
    body.compact #remote { display: none; }
    /* full area, no remote housing - the layout is scaled to the tile and uses its whole width */
    html.compact, body.compact { background: var(--body); overflow: hidden; }
    body.compact #stage { display: block; position: relative; }
    body.compact #compact {
        position: absolute; left: 0; top: 0; transform-origin: 0 0;
        display: grid; gap: 10px; box-sizing: border-box; padding: 8px 10px 10px;
        grid-template-rows: auto auto 1fr auto auto auto; align-content: stretch;
        border-radius: 0; background: transparent; box-shadow: none; color: var(--text);
    }
    body.compact .c-nav { min-height: 0; }
    body.compact .c-rock { align-self: center; }
    body.compact .c-rock button { flex: 1; height: auto; min-height: 36px; }
    .cmp > * { grid-area: auto !important; } /* the classic layout uses named grid areas */
    .c-head { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .c-power { width: 56px; height: 38px; border-radius: 12px; background: #3a2328; color: #ff5a7a; }
    .c-power.on { background: var(--accent); color: #fff; box-shadow: 0 0 14px rgba(212,0,60,.5); }
    .c-title { display: flex; align-items: center; justify-content: center; gap: 7px; max-width: 100%; min-width: 0; }
    .c-title .app { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-input { width: 100%; height: 34px; }
    .c-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
    .c-rock { display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; background: var(--key); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
    .c-rock button { height: 46px; border-radius: 0; background: transparent; box-shadow: none; font-size: 19px; font-weight: 300; }
    .c-rock button:active, .c-rock button.pressed { background: var(--key-press); }
    .c-rock .lbl { text-align: center; font-size: 9px; letter-spacing: 1px; color: var(--muted); padding: 2px 0; }
    .cmp .dpad { width: 136px; height: 136px; margin: 0 auto; }
    .cmp .dpad .ok { font-size: 13px; }
    .c-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .c-row button { height: 32px; }
    .c-mute.active { background: #5a4a1a; color: #ffcf4a; }
    .cmp .media { gap: 5px; }
    .cmp .media button { height: 30px; }
    .cmp .apps button { height: 28px; font-size: 11px; padding: 0 10px; }

    /* ---------- Symcon tile: keep the top strip free for the tile name and the expand icon ---------- */
    body.tile #stage { box-sizing: border-box; padding-top: 22px; }

    .off .c-rock, .off .c-row, .off .c-input, .off .dpad, .off .rock, .off .media, .off .color, .off .apps, .off .sub, .off .top select, .off .top button { opacity: .35; pointer-events: none; }
</style>
</head>

<script>
    var state = { power: false, muted: false, volume: null, external: false, app: '', appId: '', input: -1, inputs: [], apps: [] };
    var style = window.REMOTE_STYLE || 'remote';
    if (style === 'page') { document.body.classList.add('page'); document.documentElement.classList.add('page'); }
    if (style === 'compact') { document.body.classList.add('compact'); document.documentElement.classList.add('compact'); }
    if (window.REMOTE_CONTEXT === 'tile') document.body.classList.add('tile');
    var remote = document.getElementById(style === 'compact' ? 'compact' : 'remote');
    function each(sel, fn) { document.querySelectorAll(sel).forEach(fn); }

    function send(ident, value) {
        if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
        requestAction(ident, value);
    }

    // Buttons
    document.querySelectorAll('[data-key]').forEach(function (b) {
        b.addEventListener('click', function () { send('TileButton', b.getAttribute('data-key')); });
    });
    document.querySelectorAll('[data-vol]').forEach(function (b) {
        b.addEventListener('click', function () { send('VolumeStep', parseInt(b.getAttribute('data-vol'), 10)); });
    });
    document.querySelectorAll('[data-ch]').forEach(function (b) {
        b.addEventListener('click', function () { send('ChannelControl', parseInt(b.getAttribute('data-ch'), 10)); });
    });
    document.querySelectorAll('[data-media]').forEach(function (b) {
        b.addEventListener('click', function () { send('MediaControl', parseInt(b.getAttribute('data-media'), 10)); });
    });
    each('.js-power', function (b) { b.addEventListener('click', function () {
        state.power = !state.power; render();
        send('Power', state.power);
    }); });
    each('.js-mute', function (b) { b.addEventListener('click', function () {
        state.muted = !state.muted; render();
        send('Muted', state.muted);
    }); });
    each('.js-input', function (s) { s.addEventListener('change', function (e) {
        var v = parseInt(e.target.value, 10);
        if (v >= 0) send('Input', v);
    }); });

    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

    function render() {
        remote.classList.toggle('off', !state.power);
        each('.js-dot', function (e) { e.classList.toggle('on', state.power); });
        each('.js-power', function (e) { e.classList.toggle('on', state.power); });
        each('.js-mute', function (e) { e.classList.toggle('active', !!state.muted); });

        var inputName = '';
        state.inputs.forEach(function (i) { if (i[0] === state.input) inputName = i[1]; });
        var appText = state.power ? (state.app || inputName || 'LG TV') : 'LG TV';
        each('.js-app', function (e) { e.textContent = appText; });
        var subText = state.power ? (inputName && inputName !== state.app ? inputName : 'eingeschaltet') : 'aus';
        each('.js-sub', function (e) { e.textContent = subText; });

        var vol = '';
        if (state.power) {
            if (state.muted) vol = 'stumm';
            else if (!state.external && state.volume !== null) vol = state.volume + ' %';
            else if (state.external) vol = 'Soundbar';
        }
        each('.js-vol', function (e) { e.textContent = vol; });

        each('.js-input', function (sel) {
            sel.innerHTML = '';
            var ph = el('option', '', 'Eingang'); ph.value = '-1'; sel.appendChild(ph);
            state.inputs.forEach(function (i) { var o = el('option', '', i[1]); o.value = i[0]; sel.appendChild(o); });
            sel.value = String(state.input >= 0 ? state.input : -1);
            if (sel.value === '') sel.value = '-1';
        });

        each('.js-apps', function (apps) {
            apps.innerHTML = '';
            state.apps.forEach(function (a) {
                var b = el('button', a[2] === state.appId ? 'current' : '', a[1]);
                b.title = a[1];
                b.addEventListener('click', function () { send('AppLaunch', a[0]); });
                apps.appendChild(b);
            });
        });
        fit();
    }

    // Symcon calls this with the JSON string from UpdateVisualizationValue()
    function handleMessage(data) {
        try {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            for (var k in d) { if (d[k] !== null && d[k] !== undefined) state[k] = d[k]; }
            render();
        } catch (e) { }
    }

    // Scale the remote to the tile size; wide tiles get a two-column layout
    // Fills the available area: scales to the height and stretches the width (buttons get wider)
    var fitting = false;
    function fit() {
        if (fitting) return;
        fitting = true;
        autoHeight();
        var W = window.innerWidth, H = window.innerHeight;
        if (document.body.classList.contains('tile')) H = Math.max(80, H - 22); // strip for tile name / expand icon
        var wide = W / Math.max(H, 1) > 1.25;
        remote.classList.toggle('wide', wide);
        if (style === 'compact') {
            // Full area: phone-sized design (340 px wide) scaled to the real area, d-pad fills the free height
            var zc = Math.max(0.5, Math.min(3, W / 340, H / 520)); // never taller than the area (landscape)
            remote.classList.remove('wide');
            remote.style.transform = 'scale(' + zc + ')';
            var cw = Math.min(W / zc, 420); // landscape: keep it slim and centered
            remote.style.width = cw + 'px';
            remote.style.height = (H / zc) + 'px';
            remote.style.top = (window.innerHeight - H) + 'px';
            remote.style.left = Math.max(0, (W - cw * zc) / 2) + 'px';
            var cn = remote.querySelector('.c-nav'), cd = remote.querySelector('.dpad');
            cd.style.width = cd.style.height = '0px';
            each('#compact .c-rock', function (r) { r.style.height = '0px'; });
            var free = cn.clientWidth - 2 * 44 - 2 * 8;
            var cs = Math.max(110, Math.min(free, cn.clientHeight - 4, 320));
            cd.style.width = cd.style.height = cs + 'px';
            each('#compact .c-rock', function (r) { r.style.height = Math.round(cs * 0.9) + 'px'; });
            // tall screens (phone): spread the remaining height evenly between the rows instead of empty space around the d-pad
            remote.style.rowGap = '10px';
            var left = cn.clientHeight - cs;
            if (left > 10) remote.style.rowGap = Math.min(40, 10 + left / 5) + 'px';
            fitting = false;
            return;
        }
        if (document.body.classList.contains('page')) {
            // Work on a phone-sized layout (390 px wide, 740 px in landscape) and scale it to the real area.
            // The iOS WebFront renders pages ~900 px wide and shrinks them - without this everything would be tiny.
            var z = Math.max(0.6, Math.min(3, W / (wide ? 740 : 390)));
            remote.style.transform = 'scale(' + z + ')';
            remote.style.width = (W / z) + 'px';
            remote.style.height = (H / z) + 'px';
            remote.style.top = (window.innerHeight - H) + 'px';
            // d-pad as large as the free row allows
            var nav = remote.querySelector('.nav'), dp = remote.querySelector('.dpad');
            dp.style.width = dp.style.height = '0px';
            var size = Math.max(140, Math.min(nav.clientWidth - 8, nav.clientHeight - 8, 380));
            dp.style.width = dp.style.height = size + 'px';
            fitting = false;
            return;
        }
        if (style === 'compact') { wide = false; remote.classList.remove('wide'); }
        var base = style === 'compact' ? 250 : (wide ? 540 : 250);
        var maxW = style === 'compact' ? 420 : (wide ? 760 : 380);
        remote.style.transform = 'none';
        remote.style.width = base + 'px';
        var h = remote.offsetHeight;
        var s = Math.max(0.2, Math.min((W - 4) / base, (H - 4) / h, 2.4));
        var w = Math.max(base, Math.min(maxW, (W - 4) / s));   // use the free width
        remote.style.width = w + 'px';
        h = remote.offsetHeight;
        s = Math.max(0.2, Math.min((W - 4) / w, (H - 4) / h, 2.4));
        remote.style.transform = 'scale(' + s + ')';
        fitting = false;
    }

    // Classic WebFront: the HTMLBox iframe (data-autoheight) is sized to the free screen height
    function autoHeight() {
        try {
            var f = window.frameElement;
            if (!f || !f.hasAttribute('data-autoheight')) return;
            var top = f.getBoundingClientRect().top;
            var avail = Math.floor(window.parent.innerHeight - Math.max(0, top) - 6);
            var hgt = Math.max(300, avail);
            if (Math.abs(f.offsetHeight - hgt) > 2) {
                f.style.aspectRatio = 'auto';
                f.style.maxHeight = 'none';
                f.style.height = hgt + 'px';
            }
        } catch (e) { /* other origin -> keep size */ }
    }
    window.addEventListener('resize', fit);
    render();
</script>
</body>
</html>
